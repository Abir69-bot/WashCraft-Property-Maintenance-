# Throwaway Postgres for integration tests (`pnpm test:db:up`). Never used by the live site.
# Keep the major version in step with the Neon project and the CI service container.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: washcraft_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 20
