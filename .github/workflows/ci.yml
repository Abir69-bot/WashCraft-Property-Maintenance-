name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throwaway database. CI never connects to Neon, so it spends no Neon compute.
    # Keep the major version in step with the Neon project.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: washcraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/washcraft
      # Integration tests get their own database, so the e2e site below starts from a clean seed.
      TEST_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/washcraft_test
      PAYLOAD_SECRET: ci-only-secret-never-used-outside-ci-0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
      # Made-up analytics IDs: the browser tests check that nothing loads before consent and
      # that the loader works after it, with every request to Google and Microsoft intercepted.
      NEXT_PUBLIC_GTM_ID: GTM-E2ETEST
      NEXT_PUBLIC_CLARITY_ID: e2etest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - name: Apply committed migrations
        run: pnpm db:migrate

      - name: Site config (report only; strict on production deploys)
        run: pnpm check-config

      - name: Integration tests
        run: |
          psql "$DATABASE_URI" -c 'CREATE DATABASE washcraft_test'
          pnpm test:int

      # Plain `payload run` (no NODE_ENV=development), so the migrated schema is never pushed.
      - name: Seed starter content for the e2e site
        run: pnpm payload run src/seed/index.ts

      - run: pnpm build

      - name: Browser tests (desktop + phone, axe WCAG 2.2 AA)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      # Home, a service page and a city page on a simulated phone; 90+ in every category (§15).
      - name: Lighthouse
        run: pnpm test:lighthouse

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
          if-no-files-found: ignore

      - name: Migrations match the Payload config
        run: |
          pnpm payload migrate:create drift-check --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run: pnpm db:migrate:create <name>"
            git status --porcelain src/migrations
            exit 1
          fi
